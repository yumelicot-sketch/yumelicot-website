<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>LIVE SCHEDULE | YUMELICOT</title>
<meta name="description" content="YUMELICOTのライブスケジュール。">
<style>
:root{--bg:#080808;--panel:#111;--ink:#f6f2e9;--muted:#bdb5a8;--gold:#d7a92b;--gold2:#f4cd61;--line:#ffffff1a;--max:1040px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}a{color:inherit;text-decoration:none}.site-header{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:20px max(20px,4vw);background:#080808e8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{font-family:Georgia,"Times New Roman",serif;letter-spacing:.12em;font-size:clamp(20px,2.4vw,31px);color:var(--gold2);font-weight:600}.back{font-size:11px;letter-spacing:.15em;border:1px solid #ffffff55;padding:12px 16px}.wrap{width:min(var(--max),90vw);margin:auto;padding:150px 0 100px}.kicker{font-size:11px;letter-spacing:.24em;color:var(--gold2);font-weight:800}.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,9vw,96px);line-height:.9;margin:18px 0 26px;letter-spacing:-.045em}.lead{color:var(--muted);line-height:1.9;margin:0 0 68px}.events{border-top:1px solid var(--line)}.event{display:grid;grid-template-columns:190px 1fr;gap:40px;padding:48px 0;border-bottom:1px solid var(--line)}.date{color:var(--gold2);font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1}.dow{display:block;color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:.18em;margin-top:10px}.event h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,5vw,50px);margin:0 0 18px;line-height:1.05}.meta{display:grid;gap:8px;color:var(--muted);line-height:1.7}.meta strong{color:var(--ink);font-weight:700}.time{font-size:clamp(24px,4vw,38px);color:var(--gold2);font-weight:800;margin-top:18px}.flyer{margin-top:30px;width:min(430px,100%);border:1px solid #ffffff22;background:#111;padding:8px}.flyer img{display:block;width:100%;height:auto}.caption{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:10px}.note{margin-top:65px;padding:25px 0;color:#80796f;font-size:12px;line-height:1.8}footer{border-top:1px solid var(--line);padding:45px 5vw;text-align:center;color:#817b72;font-size:11px;letter-spacing:.08em}.footer-logo{font-family:Georgia,"Times New Roman",serif;color:var(--gold2);font-size:24px;letter-spacing:.14em;margin-bottom:10px}
@media(max-width:650px){.wrap{padding-top:125px}.event{grid-template-columns:1fr;gap:18px;padding:38px 0}.date{font-size:25px}.lead{margin-bottom:45px}.back{padding:10px 12px;font-size:10px}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">YUMELICOT</a><a class="back" href="index.html">← HOME</a></header>
<main class="wrap">
  <div class="kicker">LIVE / SCHEDULE</div>
  <h1 class="title">See you<br>at the show.</h1>
  <p class="lead">YUMELICOTの出演スケジュール。<br>ライブで会えるのを楽しみにしています。</p>
  <section class="events" id="events" aria-label="ライブスケジュール">
    <div class="event"><div>ライブ情報を読み込み中…</div></div>
  </section>
  <p class="note">※ 出演時間などは変更になる場合があります。最新情報はYUMELICOTのInstagramでもお知らせします。</p>
</main>
<footer><div class="footer-logo">YUMELICOT</div><p>Princess Princess Cover Band / Shizuoka</p><p>© 2026 YUMELICOT</p></footer>

<script>
function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
async function loadEvents(){
  const box=document.getElementById('events');
  try{
    const res=await fetch('live-data.json?ts='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('load');
    const data=await res.json();
    const events=(data.events||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(!events.length){
      box.innerHTML='<article class="event"><div>現在公開中のライブ情報はありません。</div></article>';
      return;
    }
    box.innerHTML=events.map(e=>{
      const address=e.address ? `<div>${esc(e.address)}</div>` : '';
      const openStart=e.open_start ? `<div>${esc(e.open_start)}</div>` : '';
      const flyer=e.flyer ? `<figure class="flyer"><img src="${esc(e.flyer)}" alt="${esc(e.title||'ライブ')} フライヤー"><figcaption class="caption">EVENT FLYER</figcaption></figure>` : '';
      return `<article class="event">
        <div class="date">${esc(e.date||'')}<span class="dow">${esc(e.day||'')}</span></div>
        <div>
          <h2>${esc(e.title||'')}</h2>
          <div class="meta"><div><strong>${esc(e.venue||'')}</strong></div>${address}${openStart}</div>
          <div class="time">YUMELICOT ${esc(e.yumelicot_time||'')}</div>
          ${flyer}
        </div>
      </article>`;
    }).join('');
  }catch(err){
    box.innerHTML='<article class="event"><div>ライブ情報を読み込めませんでした。Instagramで最新情報をご確認ください。</div></article>';
  }
}
loadEvents();
</script>

</body></html>
