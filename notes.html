<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YUMELICOT NOTES</title>
<style>
:root{--gold:#c99a2e;--gold2:#e3bd58;--bg:#090909;--text:#f6f3eb;--muted:#aaa39a;--line:#ffffff1a;--max:1100px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:40px 20px 80px}
.back{display:inline-block;margin-bottom:36px;color:var(--gold2);font-size:12px;letter-spacing:.14em;font-weight:800}
.kicker{color:var(--gold2);font-size:11px;letter-spacing:.22em;font-weight:800}
h1{margin:8px 0 12px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,9vw,92px);line-height:.92;letter-spacing:-.045em}
.lead{margin:0 0 44px;color:var(--muted);font-size:13px;line-height:1.9;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{position:relative;padding:28px;border:1px solid var(--line);background:linear-gradient(145deg,#111 0%,#0b0b0b 70%,#151006 100%)}
.card:before{content:"";position:absolute;left:0;top:0;width:42px;height:2px;background:var(--gold2)}
.date{color:var(--gold2);font-family:Georgia,"Times New Roman",serif;font-size:15px;letter-spacing:.06em}
h2{margin:20px 0 14px;font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1.2}
.body{color:#c9c4bc;font-size:14px;line-height:1.95;white-space:pre-wrap}
.author{margin-top:22px;color:#77716a;font-size:10px;letter-spacing:.16em;font-weight:800}
img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;margin-top:20px;border:1px solid var(--line)}
.empty{grid-column:1/-1;padding:28px;border:1px solid var(--line);color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding-top:28px}h1{font-size:52px}}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="index.html#notes">← BACK TO YUMELICOT</a>
<div class="kicker">FROM OUR DAYS</div>
<h1>YUMELICOT<br>NOTES</h1>
<p class="lead">ユメリコットのひとこと。練習のこと、ライブの裏側、ちょっとした出来事まで。気ままにゆるっと更新します。</p>
<section class="grid" id="notes-grid"><div class="empty">NOTESを読み込み中…</div></section>
</main>
<script>
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function loadNotes(){
 const box=document.getElementById('notes-grid');
 try{
  const res=await fetch('notes-data.json?ts='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('notes');
  const data=await res.json();
  const notes=(data.notes||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!notes.length){box.innerHTML='<div class="empty">まだ投稿はありません。</div>';return;}
  box.innerHTML=notes.map(n=>{
   const image=n.image?`<img src="${esc(n.image)}" alt="${esc(n.title||'YUMELICOT NOTES')}">`:'';
   const author=n.author?`<div class="author">BY ${esc(n.author).toUpperCase()}</div>`:'';
   return `<article class="card"><div class="date">${esc(n.date||'')}</div><h2>${esc(n.title||'')}</h2><div class="body">${esc(n.body||'')}</div>${image}${author}</article>`;
  }).join('');
 }catch(e){box.innerHTML='<div class="empty">NOTESを読み込めませんでした。</div>';}
}
loadNotes();
</script>
</body>
</html>
